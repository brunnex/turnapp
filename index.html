<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TurnosApp - Teste</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 400px;
    }
    h1 { font-size: 2em; margin-bottom: 10px; }
    p { font-size: 1.2em; margin: 10px 0; }
    button {
      background: white;
      color: #667eea;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      margin: 10px;
      cursor: pointer;
    }
    .saved-data {
      background: rgba(255,255,255,0.2);
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 FUNCIONA!</h1>
    <p>TurnosApp - Teste de localStorage</p>
    
    <button onclick="saveTest()">💾 Guardar Teste</button>
    <button onclick="loadTest()">📂 Carregar Teste</button>
    
    <div class="saved-data" id="result">
      <p>Clique em "Guardar Teste" primeiro!</p>
    </div>
    
    <p style="font-size: 14px; margin-top: 30px; opacity: 0.8">
      ✅ Se vir dados guardados, o localStorage funciona!<br>
      ✅ Pode adicionar ao ecrã inicial!<br>
      ✅ Dados ficam guardados para sempre!
    </p>
  </div>

  <script>
    function saveTest() {
      const data = {
        timestamp: new Date().toLocaleString('pt-PT'),
        message: 'Dados guardados com sucesso!',
        test: Math.random()
      };
      
      localStorage.setItem('turnos_test', JSON.stringify(data));
      document.getElementById('result').innerHTML = 
        '<p>✅ DADOS GUARDADOS!</p>' +
        '<p style="font-size: 12px;">Hora: ' + data.timestamp + '</p>' +
        '<p style="font-size: 12px;">Agora clique em "Carregar Teste"</p>';
    }
    
    function loadTest() {
      const saved = localStorage.getItem('turnos_test');
      
      if (saved) {
        const data = JSON.parse(saved);
        document.getElementById('result').innerHTML = 
          '<p>✅ DADOS RECUPERADOS!</p>' +
          '<p style="font-size: 12px;">Guardado em: ' + data.timestamp + '</p>' +
          '<p style="font-size: 14px; margin-top: 10px;">🎉 <strong>FUNCIONA PERFEITAMENTE!</strong></p>' +
          '<p style="font-size: 12px; margin-top: 10px;">Pode fechar e abrir de novo,<br>os dados continuam aqui!</p>';
      } else {
        document.getElementById('result').innerHTML = 
          '<p>❌ Nenhum dado guardado ainda</p>' +
          '<p style="font-size: 12px;">Clique em "Guardar Teste" primeiro</p>';
      }
    }
    
    // Tentar carregar automaticamente ao abrir
    window.onload = function() {
      const saved = localStorage.getItem('turnos_test');
      if (saved) {
        loadTest();
      }
    };
  </script>
</body>
</html>
